name: RouteWolf stability
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test subscription formats and priority failover
        run: go test -race subscription/main.go subscription/compile.go subscription/vless.go subscription/compile_test.go subscription/vless_test.go
      - name: Verify XHTTP over a real Xray client and server
        run: |
          go build -o /tmp/routewolf-subscription subscription/main.go subscription/compile.go subscription/vless.go
          python3 tests/xray_transport.py --helper /tmp/routewolf-subscription
      - name: Verify subscription routing and WAN fallback with real packets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2
          sudo python3 tests/subscription_policy.py
      - name: Verify immutable release against source and manifest
        run: |
          python3 tools/build_release.py --check
          git diff --exit-code -- releases/
      - name: Build isolated test environment
        run: docker build -t routewolf-tests -f tests/Dockerfile .
      - name: Test real nftables in a disposable network namespace
        run: |
          docker run --rm --network none --cap-add NET_ADMIN --memory=192m --cpus=1 \
            -v "$PWD:/work:ro" --entrypoint sh routewolf-tests -c \
            'touch /.routewolf-test-container; python3 -m unittest discover -s tests -p "test_*.py" -v'
